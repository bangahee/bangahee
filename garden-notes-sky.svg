<svg xmlns="http://www.w3.org/2000/svg" width="960" height="236" viewBox="0 0 960 236" role="img" aria-labelledby="title desc">
  <title id="title">Field notes from the garden</title>
  <desc id="desc">Learning by building with Python, JavaScript, Shell and Docker. The resident koi changes with public GitHub activity and refreshes daily.</desc>
  <defs>
    <linearGradient id="morningSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b0d0e2" />
      <stop offset="50%" stop-color="#cae0ec" />
      <stop offset="85%" stop-color="#dfecf2" />
      <stop offset="100%" stop-color="#e9f2f0" />
    </linearGradient>
  </defs>
  <rect width="960" height="236" rx="14" fill="url(#morningSky)"/>
  <rect x="16" y="16" width="457" height="204" rx="10" fill="#ffffff" fill-opacity=".32"/>
  <rect x="487" y="16" width="457" height="204" rx="10" fill="#ffffff" fill-opacity=".22"/>
  <g font-family="Arial, sans-serif">
    <text x="40" y="47" fill="#37634f" font-size="12" letter-spacing="3">01 / GROWING IDEAS</text>
    <text x="40" y="83" fill="#142c38" font-size="25" font-weight="bold">Learning by building.</text>
    <text x="40" y="113" fill="#3d5a6c" font-size="15">Small projects, useful tools, curious detours.</text>
    <text x="40" y="145" fill="#41664f" font-size="12" letter-spacing="2">IN THE GARDEN SHED</text>
    <g fill="#c9dfd7"><rect x="40" y="161" width="77" height="30" rx="15"/><rect x="125" y="161" width="103" height="30" rx="15"/><rect x="236" y="161" width="65" height="30" rx="15"/><rect x="309" y="161" width="78" height="30" rx="15"/></g>
    <g fill="#2e5b4b" font-size="13" text-anchor="middle"><text x="78.5" y="181">Python</text><text x="176.5" y="181">JavaScript</text><text x="268.5" y="181">Shell</text><text x="348" y="181">Docker</text></g>
    <text x="511" y="47" fill="#37634f" font-size="12" letter-spacing="3">02 / LIFE IN THE POND</text>
    <text x="511" y="83" fill="#142c38" font-size="25" font-weight="bold">A koi with a little history.</text>
    <text x="511" y="113" fill="#3d5a6c" font-size="15">Languages bring color. Contributions bring growth.</text>
    <text x="511" y="140" fill="#3d5a6c" font-size="15">Streaks leave their marks. The pond keeps moving.</text>
    <circle cx="518" cy="177" r="4" fill="#72935b"/>
    <text x="531" y="182" fill="#41664f" font-size="13">Refreshed daily from my public GitHub activity</text>
  </g>
  <g fill="#6c946a" opacity=".5"><path d="M893 217Q913 192 932 216Q912 230 893 217"/><path d="M864 220Q873 200 889 217Q878 229 864 220"/></g>
</svg>
