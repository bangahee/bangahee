name: Koi

on:
  schedule:
    # 09:20 in Korea; the koi reflects the last complete UTC day.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/koi.yml
      - render_cove.py
      - requirements-pond.txt
      - pond-cove-background.png

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: yalongwastaken/git-koi@v1.0.2
        with:
          body: white
          output-dir: koi
      - name: Render the private iris cove
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/pond-venv"
          "$RUNNER_TEMP/pond-venv/bin/python" -m pip install --disable-pip-version-check -r requirements-pond.txt
          "$RUNNER_TEMP/pond-venv/bin/python" render_cove.py
      - name: Commit the koi and cove if they changed
        shell: bash
        run: |
          git add koi/koi.gif koi/pond.gif koi/private-pond.gif koi/private-pond-still.png
          if git diff --cached --quiet; then
            echo "The pond is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: refresh the private iris cove"
          git push --quiet
