<svg xmlns="http://www.w3.org/2000/svg" width="960" height="204" viewBox="0 0 960 204" role="img" aria-labelledby="title desc">
  <title id="title">Field notes from the garden</title>
  <desc id="desc">Learning by building with Python, JavaScript, Shell and Docker. The resident koi changes with public GitHub activity and refreshes daily.</desc>
  <defs>
    <linearGradient id="pondDepth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38523a"/>
      <stop offset="48%" stop-color="#205747"/>
      <stop offset="100%" stop-color="#103c36"/>
    </linearGradient>
  </defs>
  <rect width="960" height="204" rx="14" fill="url(#pondDepth)"/>
  <path d="M480 24V180" stroke="#b9cc99" stroke-opacity=".18"/>
  <g font-family="Arial, sans-serif">
    <text x="40" y="35" fill="#d0dda9" font-size="11" letter-spacing="2.5">01 / GROWING IDEAS</text>
    <text x="40" y="69" fill="#fff3d6" font-size="22" font-weight="bold">Learning by building.</text>
    <text x="40" y="97" fill="#e0e8d2" font-size="14">Small projects, useful tools, curious detours.</text>
    <text x="40" y="128" fill="#cedda8" font-size="11" letter-spacing="2">IN THE GARDEN SHED</text>
    <g fill="#133e34"><rect x="40" y="142" width="77" height="27" rx="13.5"/><rect x="125" y="142" width="103" height="27" rx="13.5"/><rect x="236" y="142" width="65" height="27" rx="13.5"/><rect x="309" y="142" width="78" height="27" rx="13.5"/></g>
    <g fill="#e5edcf" font-size="12" text-anchor="middle"><text x="78.5" y="160">Python</text><text x="176.5" y="160">JavaScript</text><text x="268.5" y="160">Shell</text><text x="348" y="160">Docker</text></g>
    <text x="511" y="35" fill="#d0dda9" font-size="11" letter-spacing="2.5">02 / LIFE IN THE POND</text>
    <text x="511" y="69" fill="#fff3d6" font-size="22" font-weight="bold">A koi with a little history.</text>
    <text x="511" y="97" fill="#e0e8d2" font-size="14">Languages bring color. Contributions bring growth.</text>
    <text x="511" y="124" fill="#e0e8d2" font-size="14">Streaks leave their marks. The pond keeps moving.</text>
    <circle cx="518" cy="157" r="4" fill="#b9ce7f"/>
    <text x="531" y="162" fill="#cedda8" font-size="12">Refreshed daily from my public GitHub activity</text>
  </g>
</svg>
